<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="800" height="600"><title>How to Draw Northern Lights with Simple Shapes</title><rect width="200" height="150" fill="#f4efe4"/><g><rect x="0" y="50" width="200" height="100" fill="#4c6c8f" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="120" width="200" height="100" fill="#c9d9e5" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="150" width="200" height="20" fill="#f5f5f5" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="70" width="200" height="30" fill="#ffd76a" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="40" r="120" fill="#ffd76a"/><circle cx="90" cy="50" r="80" fill="#a0d2ff"/><ellipse cx="120" cy="65" rx="40" ry="30" fill="#8c9eff"/><polygon points="100,50 150,50 100,40" fill="#00a3e0" stroke-linecap="round" stroke-linejoin="round"/><line x1="50" y1="50" x2="150" y2="50" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="100" y1="50" x2="100" y2="20" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>