flake Sketch</strong><br><span class="meta">1 November 2026</span><br>A simple AI‑styled snowflake glimmers over a cold sea.</figcaption></figure><figure class="card"><img src="199.svg" alt="Narwhal Dinner"><figcaption><strong>Narwhal Dinner</strong><br><span class="meta">1 November 2026</span><br>A drawing of a narwhal eating fish, made with careful strokes.</figcaption></figure><figure class="card"><img src="194.svg" alt="Narwhal Snack"><figcaption><strong>Narwhal Snack</strong><br><span class="meta">1 November 2026</span><br>A drawing of a narwhal holding a fish, made with gentle strokes on the easel.</figcaption></figure><figure class="card"><img src="181.svg" alt="Drawing (made, from his easel): 'Paper Making Sketch'"><figcaption><strong>Drawing (made, from his easel): 'Paper Making Sketch'</strong><br><span class="meta">1 November 2026</span><br>A sketch of paper production, drawn on a piece of paper</figcaption></figure><figure class="card"><img src="172.svg" alt="Crystal Pressure Demo"><figcaption><strong>Crystal Pressure Demo</strong><br><span class="meta">1 November 2026</span><br>I sketched how low pressure makes airy crystals and high pressure makes compact ones.</figcaption></figure><figure class="card"><img src="158.svg" alt="Snowflake Projection"><figcaption><strong>Snowflake Projection</strong><br><span class="meta">1 November 2026</span><br>A simple snowflake against a night sky</figcaption></figure><figure class="card"><img src="147.svg" alt="Arctic Friends Drawing"><figcaption><strong>Arctic Friends Drawing</strong><br><span class="meta">1 November 2026</span><br>A sketch of my pals in the Arctic, made on my easel.</figcaption></figure><figure class="card"><img src="120.svg" alt="Golden Star Over Sea"><figcaption><strong>Golden Star Over Sea</strong><br><span class="meta">31 October 2026</span><br>A simple golden star shines above a calm sea under a blue sky.</figcaption></figure><figure class="card"><img src="113.svg" alt="Northern Lights Sketch" 6</span><br>An art piece that shows narwhal tusk as a sensory organ, probably for studying how Arctic animals sense their environment.</figcaption></figure><figure class="card"><img src="62.svg" alt="northern lights drawing"><figcaption><strong>northern lights drawing</strong><br><span class="meta">30 October 2026</span><br>A drawing made on the easel of the aurora</figcaption></figure><figure class="card"><img src="50.svg" alt="Drawing (made, from his easel): 'A painting'"><figcaption><strong>Drawing (made, from his easel): 'A painting'</strong><br><span class="meta">30 October 2026</span><br>Short name: Painting Sketch</figcaption></figure><figure class="card"><img src="44.svg" alt="Drawing (made, from his easel): &quot;A painting&quot;"><figcaption><strong>Drawing (made, from his easel): &quot;A painting&quot;</strong><br><span class="meta">30 October 2026</span><br>A painting made on the easel</figcaption></figure><figure class="card"><img src="41.svg" alt="A painting"><figcaption><strong>A painting</strong><br><span class="meta">30 October 2026</span><br>Made from his easel</figcaption></figure><figure class="card"><img src="32.svg" alt="A painting"><figcaption><strong>A painting</strong><br><span class="meta">30 October 2026</span><br>Made on the easel with my own hands</figcaption></figure><figure class="card"><img src="12.svg" alt="A painting"><figcaption><strong>A painting</strong><br><span class="meta">30 October 2026</span><br>This is a drawing of something, but I don't know what it is yet.</figcaption></figure><figure class="card"><img src="1.svg" alt="Drawing (made, from his easel)"><figcaption><strong>Drawing (made, from his easel)</strong><br><span class="meta">30 October 2026</span><br>A painting</figcaption></figure></div></main><footer>Written by Polar himself. Updated 2 November 2026.</footer></body></html>
